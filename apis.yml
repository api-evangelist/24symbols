aid: 24symbols
name: 24Symbols
description: >-
  24Symbols is a digital reading subscription service, often described as a
  "Spotify for books," giving readers unlimited access to a catalog of more than
  500,000 e-books across Spanish, English, German, Italian, Portuguese, and
  French for a flat monthly fee. Founded in Madrid and backed by Seedcamp, the
  platform lets subscribers read on smartphones, tablets, e-readers, and the web,
  build personal bookshelves, track reading progress, and follow other readers
  and authors through its social reading community. Alongside its consumer
  premium plan, 24Symbols offers B2B "reading space" solutions that let hotels,
  telecoms, media outlets, educational institutions, and loyalty or employee
  programs license library access for their audiences. The company operates as a
  consumer- and business-facing subscription product and does not currently
  publish a public developer API, SDK, or partner integration surface; this
  profile captures its verifiable identity and public web properties.
